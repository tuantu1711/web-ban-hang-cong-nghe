<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết sản phẩm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<script>
fetch('navbar.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('navbar-placeholder').innerHTML = data;
  });
</script>

<section class="container mt-section">

  <div class="card" style="padding:20px; display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">
    <div style="flex:1 1 320px;">
      <div class="product-image" style="width:100%; padding-top:75%; position:relative; background:#f2f4f6;">
        <img src="" alt="" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;">
      </div>
    </div>

    <div style="flex:1 1 300px;">
      <h1 id="product-title">—</h1>
      <p class="product-desc">—</p>
      <div style="margin:12px 0;">
        <strong>Giá:</strong> <span id="product-price">Liên hệ</span>
      </div>

      <table style="width:100%; border-collapse:collapse;">
        <tbody id="spec-body">
        </tbody>
      </table>

      <div style="margin-top:18px;">
        <a id="addToCart" class="btn btn-primary" href="cart.html">Thêm vào giỏ</a>
        <a id="backToShop" class="btn btn-outline" href="shop.html" style="margin-left:10px">Quay về cửa hàng</a>
      </div>
    </div>
  </div>

  <div id="notfound" style="display:none; margin-top:20px;">
    <div class="card" style="padding:18px;">
      <h3>Sản phẩm không tìm thấy</h3>
      <p>Hoặc sản phẩm đã bị xóa. <a href="shop.html">Quay về cửa hàng</a></p>
    </div>
  </div>
</section>

<script>
const products = {
  1: { title: "MacBook Air M3 8GB 256GB", img: "assets/img/p1.jpg", desc: "Ultrabook mỏng nhẹ, chip Apple M3.", price: "25.190.000₫", specs: { Chip: "Apple M3", RAM: "8GB", Storage: "256GB" } },
  2: { title: "iPhone 17 256GB", img: "assets/img/p2.jpg", desc: "iPhone 17, chip A19, màn hình 6.1\"", price: "24.590.000₫", specs: { Chip: "Apple A19", RAM: "8GB", Storage: "256GB" } },
  3: { title: "Sony WH-1000XM6", img: "assets/img/p3.jpg", desc: "Tai nghe chống ồn cao cấp.", price: "6.200.000₫", specs: { Type: "Over-ear", ANC: "Có" } },
  4: { title: "Corsair K70 Pro", img: "assets/img/p4.jpg", desc: "Bàn phím cơ chơi game.", price: "3.200.000₫", specs: { Switch: "Corsair", Layout: "Full size" } },
  5: { title: "Logitech G Pro X2 Mouse", img: "assets/img/p5.jpg", desc: "Chuột gaming hiệu năng cao.", price: "1.590.000₫", specs: { DPI: "26000", Wireless: "Có" } },
  6: { title: "JBL Xtreme 4", img: "assets/img/p6.jpg", desc: "Loa di động bass mạnh.", price: "1.700.000₫", specs: { Battery: "15h" } },
  7: { title: "MacBook Pro M5 14\" 16GB", img: "assets/img/p7.jpg", desc: "MacBook Pro M5 cho sáng tạo.", price: "43.900.000₫", specs: { Chip: "Apple M5", RAM: "16GB", Storage: "512GB" } },
  8: { title: "Samsung Galaxy S26 256GB", img: "assets/img/p8.jpg", desc: "Galaxy S26, camera AI, 120Hz.", price: "25.990.000₫", specs: { Chip: "Snapdragon 8 Gen3", RAM: "12GB", Storage: "256GB" } },
  9: { title: "Sony LinkBuds 3", img: "assets/img/p9.jpg", desc: "Earbuds nhẹ, nghe thông minh.", price: "3.900.000₫", specs: { Type: "In-ear" } },
  10:{ title: "Keychron Q2", img: "assets/img/p10.jpg", desc: "Bàn phím custom compact.", price: "2.800.000₫", specs: { Layout: "60%" } },
  11:{ title: "Dell XPS 14 2026", img: "assets/img/p11.jpg", desc: "Laptop cao cấp Intel Ultra.", price: "28.500.000₫", specs: { CPU: "Intel Core Ultra", RAM: "16GB", Storage: "512GB" } },
  12:{ title: "Xiaomi 14 Ultra 256GB", img: "assets/img/p12.jpg", desc: "Flagship Xiaomi, camera mạnh.", price: "18.900.000₫", specs: { Chip: "Snapdragon 8 Gen3", RAM: "16GB", Storage: "256GB" } },
  13:{ title: "HyperX Cloud Alpha 2", img: "assets/img/p13.jpg", desc: "Tai nghe gaming thoải mái.", price: "1.200.000₫", specs: { Type: "Gaming" } },
  14:{ title: "SteelSeries Apex Pro TKL", img: "assets/img/p14.jpg", desc: "Bàn phím cơ TKL chuyên game.", price: "3.800.000₫", specs: { Switch: "SteelSeries" } },
  15:{ title: "Acer Swift 5 2026", img: "assets/img/p15.jpg", desc: "Ultrabook mỏng nhẹ hiệu năng.", price: "19.900.000₫", specs: { Chip: "Ryzen 7", RAM: "8GB", Storage: "512GB" } },
  16:{ title: "OnePlus 13 256GB", img: "assets/img/p16.jpg", desc: "Smartphone flagship, sạc nhanh.", price: "13.900.000₫", specs: { Chip: "Snapdragon 8 Gen3", RAM: "12GB", Storage: "256GB" } },
  17:{ title: "Anker Soundcore Motion Max", img: "assets/img/p17.jpg", desc: "Loa di động pin lớn.", price: "1.100.000₫", specs: { Battery: "14h" } },
  18:{ title: "MSI Raider 16 32GB", img: "assets/img/p18.jpg", desc: "Laptop gaming cao cấp.", price: "36.900.000₫", specs: { CPU: "Intel i9", RAM: "32GB", Storage: "1TB" } },
  19:{ title: "Sennheiser Momentum 4", img: "assets/img/p19.jpg", desc: "Tai nghe lifestyle chất lượng.", price: "4.990.000₫", specs: { Type: "Over-ear" } },
  20:{ title: "Microsoft Designer Keyboard", img: "assets/img/p20.jpg", desc: "Bàn phím văn phòng cao cấp.", price: "1.190.000₫", specs: { Layout: "Compact" } }
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function showNotFound() {
  document.querySelector('section.container').querySelector('div.card').style.display='none';
  document.getElementById('notfound').style.display='block';
}

if (!id || !products[id]) {
  showNotFound();
} else {
  const p = products[id];

  document.getElementById('product-title').innerText = p.title;
  document.querySelector('.product-image img').src = p.img;
  document.querySelector('.product-image img').alt = p.title;
  document.querySelector('.product-desc').innerText = p.desc;
  document.getElementById('product-price').innerText = p.price || "Liên hệ";

  const specBody = document.getElementById('spec-body');
  specBody.innerHTML = '';
  Object.entries(p.specs || {}).forEach(([k,v]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="padding:6px; width:40%;"><strong>${k}</strong></td><td style="padding:6px;">${v}</td>`;
    specBody.appendChild(tr);
  });

  document.getElementById('addToCart').href = `cart.html?add=${encodeURIComponent(id)}`;
}
</script>

<footer class="footer">© 2026 SimpleWeb</footer>

</body>
</html>
