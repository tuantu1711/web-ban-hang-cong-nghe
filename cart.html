<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ hàng</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<script>
  fetch('navbar.html').then(res => res.text()).then(data => { document.getElementById('navbar-placeholder').innerHTML = data; });
</script>

<section class="cart-section">
  <div class="cart-box">
    <h2>Giỏ hàng</h2>
    <table class="table" id="cart-table">
      <thead>
        <tr>
          <th>Sản phẩm</th>
          <th>Giá</th>
          <th>Số lượng</th>
          <th>Xóa</th>
        </tr>
      </thead>
      <tbody id="cart-content"></tbody>
    </table>
    <div id="empty-msg" style="display:none; text-align:center;">Giỏ hàng trống. <a href="shop.html">Mua ngay</a></div>
    <div class="cart-action" id="cart-footer">
      <a href="checkout.html" class="btn btn-primary">Thanh toán</a>
      <button onclick="clearCart()" class="btn btn-outline">Xóa hết</button>
    </div>
  </div>
</section>

<script>
const products = {
  1: { title: "MacBook Air M3 8GB 256GB", price: 25190000 },
  2: { title: "iPhone 17 256GB", price: 24590000 },
  3: { title: "Sony WH-1000XM6", price: 6200000 },
  4: { title: "Corsair K70 Pro", price: 3200000 },
  5: { title: "Logitech G Pro X2 Mouse", price: 1590000 },
  6: { title: "JBL Xtreme 4", price: 1700000 },
  7: { title: "MacBook Pro M5 14\" 16GB", price: 43900000 },
  8: { title: "Samsung Galaxy S26 256GB", price: 25990000 },
  9: { title: "Sony LinkBuds 3", price: 3900000 },
  10:{ title: "Keychron Q2", price: 2800000 },
  11:{ title: "Dell XPS 14 2026", price: 28500000 },
  12:{ title: "Xiaomi 14 Ultra 256GB", price: 18900000 },
  13:{ title: "HyperX Cloud Alpha 2", price: 1200000 },
  14:{ title: "SteelSeries Apex Pro TKL", price: 3800000 },
  15:{ title: "Acer Swift 5 2026", price: 19900000 },
  16:{ title: "OnePlus 13 256GB", price: 13900000 },
  17:{ title: "Anker Soundcore Motion Max", price: 1100000 },
  18:{ title: "MSI Raider 16 32GB", price: 36900000 },
  19:{ title: "Sennheiser Momentum 4", price: 4990000 },
  20:{ title: "Microsoft Designer Keyboard", price: 1190000 }
};

let cart = JSON.parse(localStorage.getItem('cart')) || [];

const params = new URLSearchParams(window.location.search);
const addId = params.get("add");
if (addId && products[addId]) {
  const existing = cart.find(item => item.id == addId);
  if (existing) { existing.qty += 1; } 
  else { cart.push({ id: addId, qty: 1 }); }
  localStorage.setItem('cart', JSON.stringify(cart));
  window.history.replaceState({}, document.title, "cart.html");
}

function renderCart() {
  const container = document.getElementById('cart-content');
  if (cart.length === 0) {
    document.getElementById('cart-table').style.display = 'none';
    document.getElementById('cart-footer').style.display = 'none';
    document.getElementById('empty-msg').style.display = 'block';
    return;
  }
  container.innerHTML = cart.map((item, index) => `
    <tr>
      <td>${products[item.id].title}</td>
      <td>${products[item.id].price.toLocaleString()}₫</td>
      <td><input type="number" value="${item.qty}" min="1" onchange="updateQty(${index}, this.value)"></td>
      <td><button onclick="removeItem(${index})">❌</button></td>
    </tr>
  `).join('');
}

function updateQty(index, val) {
  cart[index].qty = parseInt(val);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}
  
function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function clearCart() {
  localStorage.removeItem('cart');
  cart = [];
  renderCart();
}

renderCart();
</script>
</body>
</html>
